{% extends "base.html" %}
{% block title %}{{ '新增文章' if mode == 'create' else '編輯文章' }} - 我的部落格{% endblock %}
{% block content %}
  <h2>{{ '新增文章' if mode == 'create' else '編輯文章' }}</h2>

  <form method="post">
    <label for="title">標題</label>
    <input id="title" name="title" value="{{ post['title'] if post['title'] }}" required>

    <label for="author">作者</label>
    <input id="author" name="author" value="{{ post['author'] if post['author'] }}" required>

    <label for="content">文章內容</label>
    <textarea id="content" name="content" required>{{ post['content'] if post['content'] }}</textarea>

    <div class="actions">
      <button class="btn" type="submit">{{ '發布' if mode == 'create' else '儲存' }}</button>
      {% if mode == 'edit' %}
        <a class="btn btn-gray" href="{{ url_for('post_detail', post_id=post['id']) }}">取消</a>
      {% else %}
        <a class="btn btn-gray" href="{{ url_for('index') }}">取消</a>
      {% endif %}
    </div>
  </form>
{% endblock %}
